{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>

        <!-- Meta -->
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="Eduleb - Education HTML Template">
        <meta name="keywords" content="agency, business, corporate, creative, html5, modern, multipurpose, One Page, parallax, startup">        
        
        <!-- SITE TITLE -->
        <title>{% block title %}Eduleb - Education HTML Template{% endblock %}</title>        
        
        <!-- Latest Bootstrap min CSS -->
        <link rel="stylesheet" href="{% static 'assets/bootstrap/css/bootstrap.min.css' %}">        
        
        <!-- Google Font -->
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        
        <!-- Font Awesome CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="{% static 'assets/fonts/font-awesome.min.css' %}">
        <link rel="stylesheet" href="{% static 'assets/fonts/themify-icons.css' %}">
        
        <!--- owl carousel Css-->
        <link rel="stylesheet" href="{% static 'assets/owlcarousel/css/owl.carousel.css' %}">
        <link rel="stylesheet" href="{% static 'assets/owlcarousel/css/owl.theme.css' %}">  
        
        <!--jquery-simple-mobilemenu Css-->
        <link rel="stylesheet" href="{% static 'assets/css/jquery-simple-mobilemenu.css' %}">           
        
        <!-- MAGNIFIC CSS -->
        <link rel="stylesheet" href="{% static 'assets/css/magnific-popup.css' %}">     
        
        <!-- animate CSS -->
        <link rel="stylesheet" href="{% static 'assets/css/animate.css' %}">    
        
        <!-- Style CSS -->                  
        <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">                  

        <!--[if lt IE 9]>
          <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
          <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
        <![endif]-->
        
    </head>
    
    <body data-spy="scroll" data-offset="80" class="d-flex flex-column min-vh-100">

        <!-- START PRELOADER -->
        <div class="preloaders">
            <span class="loader"></span>
        </div>
        <!-- END PRELOADER -->      
            
        {% include 'partials/header.html' %}

        <!-- MAIN CONTENT -->
        <main class="flex-fill">
            {% block content %}
            
            {% endblock %}
        </main>

            {% include 'partials/footer.html' %}
    
        <!-- <script src="https://assets/js.stripe.com/v3/"></script> -->
        <script src="https://js.stripe.com/v3/"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- jQuery أولاً -->
        <script src="{% static 'assets/js/jquery-1.12.4.min.js' %}"></script>

        <!-- بعد jQuery -->
        <script src="{% static 'assets/js/main.js' %}"></script>

        <!-- Stripe code -->
        <script src="{% static 'assets/js/stripe.js' %}"></script>

        <script src="{% static 'assets/bootstrap/js/bootstrap.min.js' %}"></script>
        <script src="{% static 'assets/js/modernizr-2.8.3.min.js' %}"></script>
        <script src="{% static 'assets/js/jquery-simple-mobilemenu.js' %}"></script>
        <script src="{% static 'assets/owlcarousel/js/owl.carousel.min.js' %}"></script>
        <script src="{% static 'assets/js/jquery.magnific-popup.min.js' %}"></script>
        <script src="{% static 'assets/js/jquery.inview.min.js' %}"></script>
        <script src="{% static 'assets/js/scrolltopcontrol.js' %}"></script>
        <script src="{% static 'assets/js/wow.min.js' %}"></script>
        <script src="{% static 'assets/js/scripts.js' %}"></script>
        
    </body>
</html>
