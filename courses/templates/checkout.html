{% extends "base.html" %}
{% load i18n %}
{% load static %}
{% load my_filters %}

{% block content %}
<section class="py-5" style="background-color: #f8f9fa;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
                    
                    <h3 class="fw-bold text-danger text-center mb-3" style="font-size: 1.5rem;">{% trans "Enroll Now" %}</h3>
                    <p class="text-muted small text-center mb-4">
                       {% trans "Instant Access After Payment." %}
                    </p>

                    <form id="form-user-info">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label small fw-bold">{% trans "Full Name" %} *</label>
                            <input type="text" name="full_name" class="form-control" placeholder="{% trans 'Enter your full name' %}" required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label small fw-bold">{% trans "Email Address" %} *</label>
                            <input type="email" name="email" class="form-control bg-light" value="{{ request.user.email }}" readonly required>
                        </div>



                       <div class="text-center mb-3">
                            <label class="form-label small fw-bold mb-0 text-muted">{% trans "Click below to proceed with payment" %}</label>
                        </div>
                        <div class="row">
                            
                           <div class="col-12 mb-3">
                                <div class="card payment-card w-100 border rounded-3 p-3 shadow-sm text-center" role="button" id="stripe-option" onClick='createStripeSession()'>
                                    <div class="card-body d-flex flex-column align-items-center justify-content-center py-3">
                                        <i class="lni lni-credit-cards text-success display-4 mb-2"></i>
                                        <h5 class="card-title fw-bold text-dark mb-0">{% trans "Credit Card" %}</h5>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12">
                            <div id="payment-form-container">
                                <div id="stripe-card" class="card my-3 p-3" style="display: none">
                                    <div id="payment-element">
                                    </div>
                                    <button type="button" id="stripe-submit" class="btn btn-primary mt-3">
                                        {% trans 'Pay Now' %}
                                    </button>
                                </div>
                                </div>
                                
                            </div>
                            </div>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted"><i class="fa-solid fa-shield-halved me-1"></i> {% trans "30-day money-back guarantee" %}</small>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const cardInput = document.getElementById('credit-card');

    if (cardInput) {
        cardInput.addEventListener('input', function (e) {
            let digits = e.target.value.replace(/\D/g, '');
            digits = digits.substring(0, 23);
            let formatted = '';

            let cardPart = digits.substring(0, 16);
            if (cardPart.length > 0) {
                formatted += cardPart.match(/.{1,4}/g).join(' ');
            }

            if (digits.length > 16) {
                let expPart = digits.substring(16, 20);
                if (expPart.length <= 2) {
                    formatted += '  ' + expPart;
                } else {
                    formatted += '  ' + expPart.substring(0, 2) + '/' + expPart.substring(2);
                }
            }

            if (digits.length > 20) {
                let cvcPart = digits.substring(20, 23);
                formatted += '  ' + cvcPart;
            }

            e.target.value = formatted;
        });
    }
});
</script>
{% endblock %}
